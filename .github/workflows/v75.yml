name: Signaux V75

on:
  schedule:
    # Toutes les heures, 24h/24 et 7j/7 (le V75 ne ferme jamais)
    - cron: "2 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = message de test, signal = analyse réelle"
        default: "test"

jobs:
  v75:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lancer
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            python bot.py --test
          else
            python bot.py
          fi
          
